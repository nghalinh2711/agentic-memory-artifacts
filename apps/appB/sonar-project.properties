sonar.projectKey=App-B
sonar.sources=src
sonar.tests=tests
sonar.host.url=http://localhost:9000

# Coverage (Vitest LCOV)
sonar.javascript.lcov.reportPaths=tests/artifacts/coverage/lcov.info
# Keep coverage artifacts out of source/test indexing
sonar.exclusions=**/tests/artifacts/**
sonar.test.exclusions=**/tests/artifacts/**